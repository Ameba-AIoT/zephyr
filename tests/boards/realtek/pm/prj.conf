CONFIG_ZTEST=y

CONFIG_PM=y

# The suspend-to-RAM resume path runs on the idle stack before the kernel is
# fully back, and the ameba HAL's restore code needs more than the default.
CONFIG_IDLE_STACK_SIZE=4096

CONFIG_RTC=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_AMEBA=y

CONFIG_COUNTER=y

CONFIG_LOG=y
# Deferred logging drops the tail of the output when the AP powers down, and
# these tests power it down on purpose.
CONFIG_LOG_MODE_IMMEDIATE=y

# AmebaSmart (RTL8730E / CA32) overrides.

# The immediate logging prj.conf asks for (so that the tail of the output is not
# lost when the AP powers down) crashes on the CA32: the compiler vectorises
# cbvprintf with NEON :64 stores, which fault on the not-8-byte-aligned
# interrupt stack (a latent cortex_a_r arch bug). Use deferred logging, which
# formats on the log thread's stack, and keep FP context off the IRQ path.
# ztest's own output goes through printk and is unaffected.
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_FPU_SHARING=n

# Keep printk out of the deferred log, or every ztest line issued from the point
# the AP goes down until the log thread next runs is lost -- which is exactly the
# output that says what happened. printk then formats on the calling thread's
# stack and reaches the console synchronously.
CONFIG_LOG_PRINTK=n

# SMP (both CA32 cores) with full cluster power-gating: CPU1 hotplugs off, CPU0
# cluster-PGs, CPU1 is re-started and context-restored on warm boot. Exercising
# the single-core path instead would not be representative of how this SoC runs.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2

# PSCI CPU_SUSPEND (into TF-A) is the PG mechanism.
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

# The ameba os_wrapper (used by ipc_send_message on the PG path) lazily creates
# a mutex via k_malloc; without a heap that returns NULL -> NULL deref crash.
CONFIG_HEAP_MEM_POOL_SIZE=65536

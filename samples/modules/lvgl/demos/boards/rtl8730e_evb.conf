# Select LVGL benchmark demo
CONFIG_LV_Z_DEMO_BENCHMARK=y

# 16-bit color depth (RGB565) + NEON ASM acceleration
# NEON blend optimizations in LVGL only exist for RGB565/RGB888 targets,
# so 16-bit mode enables actual hardware acceleration
CONFIG_LV_COLOR_DEPTH_16=y
# CONFIG_LV_COLOR_DEPTH_32 is not set

# GPIO for panel reset (PA_14)
CONFIG_GPIO=y

# Framebuffer format - BGR565 to match NEON blend optimizations
CONFIG_AMEBA_LCDC_BGR565=y
# CONFIG_AMEBA_LCDC_ARGB8888 is not set

# LVGL memory
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_HEAP_MEM_POOL_SIZE=131072

# Larger stack for widgets demo
CONFIG_MAIN_STACK_SIZE=8192

# Force enable widgets demo internal flag directly too
CONFIG_LV_USE_DEMO_WIDGETS=y

# Enable NEON assembly optimization
CONFIG_LV_DRAW_SW_ASM_NEON=y
CONFIG_LV_DEF_REFR_PERIOD=16

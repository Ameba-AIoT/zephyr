# Select LVGL benchmark demo
CONFIG_LV_Z_DEMO_BENCHMARK=y

# 16-bit color depth (RGB565)
CONFIG_LV_COLOR_DEPTH_16=y
# CONFIG_LV_COLOR_DEPTH_24 is not set
# CONFIG_LV_COLOR_DEPTH_32 is not set

# No CPU SIMD assembly on this target: AmebaG2 is Cortex-M55 and MVE (Helium)
# is not enabled in the build, so the NEON path used by the AmebaSmart (Cortex-A)
# board does not apply. Blends/fills/image decode are hardware-accelerated by the
# PPE and MJPEG blocks enabled below instead.

# GPIO for panel backlight/display enable
CONFIG_GPIO=y

# Framebuffer format - RGB888 (3 bytes/pixel) on the parallel-RGB (DPI) LCDC
# path.  Framebuffers live in PSRAM (0x60131000), so the wider pixel does not
# affect sram0.  PPE and the panel output both support RGB888.
CONFIG_AMEBA_LCDC_RGB565=y
# CONFIG_AMEBA_LCDC_RGB888 is not set
# CONFIG_AMEBA_LCDC_ARGB8888 is not set

# Note: the 16-bit LVGL flush path does no byte swap.  LVGL stores RGB565
# little-endian and the Realtek LCDC "RGB565" input format matches both the
# channel order (R high, B low) and byte order, so neither
# CONFIG_LV_COLOR_16_SWAP nor an R/B swap is needed here.

# LVGL memory
# AmebaG2 sram0 is 296 KB, shared between the LVGL pool, the system heap,
# stacks, framebuffers and BSS, so the system heap is trimmed (vs the
# AmebaSmart board which has external PSRAM) to fit the region.
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_HEAP_MEM_POOL_SIZE=98304

# Larger stack for widgets demo
CONFIG_MAIN_STACK_SIZE=8192

# Force enable widgets demo internal flag directly too
CONFIG_LV_USE_DEMO_WIDGETS=y

CONFIG_LV_DEF_REFR_PERIOD=16

# Realtek PPE (Pixel Processing Engine) hardware acceleration
CONFIG_AMEBA_PPE=y
CONFIG_LV_USE_DRAW_PPE=y

# Realtek MJPEG hardware decoder
CONFIG_AMEBA_MJPEG=y
CONFIG_LV_USE_AMEBA_DECODER=y

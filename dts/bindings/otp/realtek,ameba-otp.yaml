description: |
  Realtek Ameba OTP (one-time programmable) memory controller.

  Exposes the OTP physical area as a linear byte array through the Zephyr OTP
  API. Bits can only be programmed from 1 to 0.

compatible: "realtek,ameba-otp"

include: base.yaml

properties:
  reg:
    required: true

  size:
    type: int
    required: true
    description: Size of the OTP physical area in bytes.
